{% extends 'home.html' %}

{% block content %}
	<h3 class="text-center">作者列表</h3>
    <a href="{% url 'author_add' %}" class="btn btn-success">添加</a>
    <table class="table-striped table">
        <thead>
            <tr>
                <th>id</th>
                <th>作者</th>
                <th>年龄</th>
                <th>手机号</th>
                <th>地址</th>
                <th>操作</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for author_obj in author_queryset %}
            	<tr>
                    <td>{{ author_obj.id }}</td>
                    <td>{{ author_obj.name }}</td>
                    <td>{{ author_obj.age }}</td>
                    <td>{{ author_obj.author_detail.phone }}</td>
                    <td>{{ author_obj.author_detail.addr }}</td>
                    <td><a href="{% url 'author_edit' author_obj.id %}" class="btn btn-xs btn-primary">编辑</a></td>
                    <td><a href="{% url 'author_delete' author_obj.id %}" class="btn btn-xs btn-danger">删除</a></td>
                </tr>
            {% endfor %}
            
        </tbody>
    </table>
{% endblock %}
